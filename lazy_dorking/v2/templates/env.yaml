id: blh-env-content
info:
  name: Environment configuration content at discovered URL
  author: blh-hunter
  severity: info
http:
  - method: GET
    path:
      - "{{BaseURL}}"
    redirects: false
    max-size: 1048576
    matchers-condition: and
    matchers:
      - type: status
        status: [200]
      - type: regex
        part: body
        regex:
          - '(?m)^(APP_KEY|DB_PASSWORD|DATABASE_URL|AWS_SECRET_ACCESS_KEY)\s*=\s*[^\r\n]+'
