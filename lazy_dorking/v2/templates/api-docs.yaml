id: blh-api-docs-content
info:
  name: API schema at discovered URL
  author: blh-hunter
  severity: info
http:
  - method: GET
    path:
      - "{{BaseURL}}"
    redirects: false
    max-size: 1048576
    matchers-condition: and
    matchers:
      - type: status
        status: [200]
      - type: regex
        part: body
        regex:
          - '"(openapi|swagger)"\s*:\s*"[0-9]'
      - type: word
        part: body
        words: ['"paths"']
